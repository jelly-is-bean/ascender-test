---
- name: Validate Ascender job execution
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Display Ansible version
      ansible.builtin.debug:
        msg: "Ansible version: {{ ansible_version.full }}"

    - name: Display execution environment details
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ ansible_facts['hostname'] }}"
          - "OS: {{ ansible_facts['distribution'] }}"
          - "Python: {{ ansible_facts['python_version'] }}"

    - name: Verify basic task execution
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.14', '>=')
        success_msg: "Ansible execution validation passed"
        fail_msg: "Ansible version is older than expected"

    - name: Confirm job completed
      ansible.builtin.debug:
        msg: "Ascender execution environment is operational!"
